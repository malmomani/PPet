[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-brain"
version = "0.1.0"
description = "Brain server for Maya, an AI companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
voice = ["kokoro-onnx>=0.4"]

[tool.setuptools.packages.find]
include = ["maya_brain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
